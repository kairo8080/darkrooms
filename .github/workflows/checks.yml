name: DARKROOMS checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks
  cancel-in-progress: true

env:
  # FriendSDK v0.1.4 (spokesz/friendsdk main, 29 Sep 2026)
  FRIENDSDK_COMMIT: ca3bf183b809ecf22d87c63d88ce03969a3f8da2

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch FriendSDK and add DARKROOMS
        run: |
          git clone https://github.com/spokesz/friendsdk.git sdk
          git -C sdk checkout "$FRIENDSDK_COMMIT"
          cp -R games/darkrooms sdk/games/darkrooms
          cp tests/darkrooms.browser.mjs sdk/darkrooms.browser.mjs

      - name: Install and build FriendSDK
        working-directory: sdk
        run: |
          npm ci
          npm run build

      - name: Validate the game (friendsdk check)
        working-directory: sdk
        run: node scripts/dev-game.mjs check games/darkrooms

      - name: Build the static preview (friendsdk build)
        working-directory: sdk
        run: node scripts/dev-game.mjs build games/darkrooms

      - name: Typecheck
        working-directory: sdk
        run: npx tsc -p games/darkrooms/tsconfig.json

      - name: Browser checks with the SDK mock wallet (desktop and phone)
        working-directory: sdk
        run: |
          npx playwright install --with-deps chromium
          node darkrooms.browser.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darkrooms-checks
          path: artifacts
          if-no-files-found: ignore
